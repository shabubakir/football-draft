      - region [ref=f38e1728]:
        - heading "CS2 Marketplace FAQ" [level=2] [ref=f38e1729]
        - generic [ref=f38e1730]:
          - heading "What is the best marketplace to buy CS2 skins?" [level=3] [ref=f38e1731]
          - paragraph [ref=f38e1732]: The best marketplace depends on the specific skin and current listings. SteamAnalyst compares prices across 40+ trusted marketplaces in real-time so you can instantly find the lowest price. Third-party markets like Skinport, DMarket, and Buff163 often offer lower prices than the Steam Market due to reduced fees.
        - generic [ref=f38e1733]:
          - heading "How do CS2 skin prices differ between marketplaces?" [level=3] [ref=f38e1734]
          - paragraph [ref=f38e1735]: CS2 skin prices can vary by 10-30% between marketplaces due to differences in seller fees, regional pricing, supply and demand on each platform, and payment methods. The Steam Market charges 15% fees while third-party sites typically charge 5-10%, which is often reflected in lower listing prices.
        - generic [ref=f38e1736]:
          - heading "Is the Steam Market the cheapest place to buy CSGO skins?" [level=3] [ref=f38e1737]
          - paragraph [ref=f38e1738]: The Steam Market is not always the cheapest option. While it is the most convenient, its 15% seller fee often results in higher prices compared to third-party marketplaces. Use SteamAnalyst's price comparison tool to check all platforms before buying.
        - generic [ref=f38e1739]:
          - heading "How often are marketplace prices updated on SteamAnalyst?" [level=3] [ref=f38e1740]
          - paragraph [ref=f38e1741]: SteamAnalyst updates marketplace prices every 15 minutes, ensuring you always see near real-time pricing data. Our system aggregates listings from all major CS2 marketplaces to provide accurate, up-to-date price comparisons.
        - generic [ref=f38e1742]:
          - heading "What does the SA column show?" [level=3] [ref=f38e1743]
          - paragraph [ref=f38e1744]: "SA is the SteamAnalyst reference price: an aggregate of the third-party markets we track, recomputed every few minutes, falling back to Steam's recent sale average for items no third-party market lists. It is the same number the skin page headlines, so the column and the page you click through to always agree. It is a statistic, not a listing, which is why it never wins the best-price marker."
