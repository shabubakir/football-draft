    - generic [ref=f1e1174]:
      - generic [ref=f1e1175]:
        - generic [ref=f1e1176]:
          - generic [aria-hidden] [ref=f1e1177]: 
          - generic [ref=f1e1178]:
            - heading "Origin Story" [level=2] [ref=f1e1179]
            - paragraph [ref=f1e1180]: The AWP Dragon Lore, released on July 1, 2014, as part of Operation Breakout, is a highly recognizable skin from The Cobblestone Collection. Its custom painted design features an intricate knotwork dragon, making it one of the most popular and demanded skins in CS2. The skin's long-standing fame and collector appeal contribute to its premium status in the market. As the flavor text suggests, "200 keys could never unlock its secrets," hinting at its elusive nature and desirability.
        - generic [ref=f1e1181]:
          - generic [aria-hidden] [ref=f1e1182]: 
          - generic [ref=f1e1183]:
            - heading "Drop Chance" [level=2] [ref=f1e1184]
            - paragraph [ref=f1e1185]: AWP | Dragon Lore is Covert, a Red-tier skin, the rarest standard drop grade. It has appeared across 10 tournament packages, most recently the ESL One Katowice 2015 Cobblestone Souvenir Package, Krakow 2017 Cobblestone Souvenir Package, and MLG Columbus 2016 Cobblestone Souvenir Package. Souvenir Packages are awarded to viewers watching live Major matches on the corresponding map, not opened from cases, so Valve doesn't publish per-skin drop odds. Each package contains one item from The Cobblestone Collection, with rarity tiers drawn on a weighted system that heavily favors common grades, meaning Covert skins like Dragon Lore are a small fraction of total package contents. New copies only enter the market when a recipient chooses to open their package, so supply trickles in over time even after the tournament ends.
        - generic [ref=f1e1186]:
          - generic [aria-hidden] [ref=f1e1187]: 
          - generic [ref=f1e1188]:
            - heading "Skin Condition" [level=2] [ref=f1e1189]
            - paragraph [ref=f1e1190]: "Float range 0 to 0.7. Exteriors: Factory New, Minimal Wear, Field-Tested, Well-Worn, Battle-Scarred."
            - list [ref=f1e1191]:
              - listitem [ref=f1e1192]: "Factory New (No Recent Price): The custom painted knotwork dragon is fully intact and vibrant across the AWP's body."
              - listitem [ref=f1e1193]: "Minimal Wear (No Recent Price): Minor scuffs begin to appear on the edges of the scope and stock, but the dragon motif remains clear."
              - listitem [ref=f1e1194]: "Field-Tested (No Recent Price): Noticeable wear appears on the barrel and stock, with some paint loss on the dragon's scales."
              - listitem [ref=f1e1195]: "Well-Worn (No Recent Price): Significant paint abrasion is visible on the weapon's body, particularly around the scope and magazine, though the dragon's form is still recognizable."
              - listitem [ref=f1e1196]: "Battle-Scarred (No Recent Price): Heavy wear and substantial paint loss cover much of the AWP, leaving the dragon design heavily faded and distressed."
        - generic [ref=f1e1197]:
          - generic [aria-hidden] [ref=f1e1198]: 
          - generic [ref=f1e1199]:
            - heading "Model" [level=2] [ref=f1e1200]
            - paragraph [ref=f1e1201]: Dragon Lore uses the legacy AWP model, introduced with Operation Breakout on July 1, 2014. The inspect animation and third-person appearance match the original CS:GO version.
      - generic [ref=f1e1202]:
        - generic [ref=f1e1203]:
          - generic [aria-hidden] [ref=f1e1204]: 
          - generic [ref=f1e1205]:
            - heading "How to Obtain" [level=2] [ref=f1e1206]
            - paragraph [ref=f1e1207]: The AWP | Dragon Lore is exclusively found in Souvenir Packages from The Cobblestone Collection. These packages, such as the Atlanta 2017 Cobblestone Souvenir Package and the ESL One Cologne 2014 Cobblestone Souvenir Package, were awarded to viewers during past Major tournaments. Since new packages are no longer distributed, the original supply is fixed. Consequently, buyers primarily acquire this highly sought-after skin on the Steam Community Market, third-party marketplaces, or through various CS2 skin trading sites.
        - generic [ref=f1e1208]:
          - generic [aria-hidden] [ref=f1e1209]: 
          - generic [ref=f1e1210]:
            - heading "Price Range" [level=2] [ref=f1e1211]
